{{- if eq (include "database.managed" .) "true" -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{.Values.database.clusterName | default "basyx-database" }}
  labels:
    {{- include "basyx.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.database.instances }}
  primaryUpdateStrategy: unsupervised
  storage:
    size: {{ .Values.database.storage.size }}
    {{- with .Values.database.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  {{- if .Values.database.walStorage.enabled }}
  walStorage:
    size: {{ .Values.database.walStorage.size }}
    {{- with .Values.database.walStorage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- with .Values.database.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.database.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.database.topologySpreadConstraints }}
  topologySpreadConstraints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.database.postgresql.parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{.Values.database.database | default "basyx" }}
      owner: {{.Values.database.owner | default "basyx" }}

{{- end }}
