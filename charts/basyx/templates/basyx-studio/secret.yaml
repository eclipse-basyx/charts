{{- if and .Values.basyxStudio.enabled (include "basyx-studio.createSecret" .) }}
{{- $studio := .Values.basyxStudio }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "basyx-studio.secretName" .) | default dict }}
{{- $existingData := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "basyx-studio.secretName" . }}
  labels:
    {{- include "basyx-studio.labels" . | nindent 4 }}
  {{- if and (not $studio.dataKey.existingSecret) (not $studio.dataKey.value) }}
  annotations:
    # A generated data key must outlive the release: data encrypted with it
    # cannot be read with a new key.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- if not $studio.dataKey.existingSecret }}
  {{- if $studio.dataKey.value }}
  {{ $studio.dataKey.existingSecretKey }}: {{ $studio.dataKey.value | b64enc | quote }}
  {{- else if hasKey $existingData $studio.dataKey.existingSecretKey }}
  {{ $studio.dataKey.existingSecretKey }}: {{ get $existingData $studio.dataKey.existingSecretKey | quote }}
  {{- else }}
  {{- /* 32 random bytes as base64url without padding. */}}
  {{ $studio.dataKey.existingSecretKey }}: {{ randBytes 32 | replace "+" "-" | replace "/" "_" | trimSuffix "=" | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if include "basyx-studio.inlineOidcClientSecret" . }}
  {{ $studio.auth.oidc.clientSecret.existingSecretKey }}: {{ $studio.auth.oidc.clientSecret.value | b64enc | quote }}
  {{- end }}
  {{- if and $studio.database.url (not $studio.database.existingSecret) }}
  {{ $studio.database.existingSecretKey }}: {{ $studio.database.url | b64enc | quote }}
  {{- end }}
{{- end }}
