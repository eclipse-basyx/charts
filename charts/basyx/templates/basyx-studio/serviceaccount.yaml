{{- if .Values.basyxStudio.enabled }}
{{- if .Values.basyxStudio.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "basyx-studio.serviceAccountName" . }}
  labels:
    {{- include "basyx-studio.labels" . | nindent 4 }}
  {{- with .Values.basyxStudio.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.basyxStudio.serviceAccount.automount }}
{{- end }}
{{- end }}
