suite: database configuration
release:
  name: basyx
templates:
  - templates/postgres.yaml
  - templates/database-secret.yaml
  - templates/configuration-service-job.yaml
  - templates/aas-registry/deployment.yaml
  - templates/keycloak/deployment.yaml
tests:
  - it: renders a managed CloudNativePG cluster by default
    template: templates/postgres.yaml
    asserts:
      - isKind:
          of: Cluster
      - equal:
          path: apiVersion
          value: postgresql.cnpg.io/v1
      - equal:
          path: metadata.name
          value: basyx-database
      - equal:
          path: spec.instances
          value: 3
      - equal:
          path: spec.primaryUpdateStrategy
          value: unsupervised
      - equal:
          path: spec.storage.size
          value: 10Gi
      - notExists:
          path: spec.storage.storageClass
      - notExists:
          path: spec.walStorage
      - notExists:
          path: spec.resources
      - notExists:
          path: spec.affinity
      - notExists:
          path: spec.topologySpreadConstraints
      - notExists:
          path: spec.postgresql

  - it: renders a PGDATA storage class without enabling WAL storage
    template: templates/postgres.yaml
    set:
      database.storage.storageClass: fast-data
    asserts:
      - equal:
          path: spec.storage.storageClass
          value: fast-data
      - notExists:
          path: spec.walStorage

  - it: renders separate WAL storage only when enabled
    template: templates/postgres.yaml
    set:
      database.walStorage.enabled: true
      database.walStorage.size: 25Gi
      database.walStorage.storageClass: fast-wal
    asserts:
      - equal:
          path: spec.walStorage
          value:
            size: 25Gi
            storageClass: fast-wal

  - it: renders PostgreSQL resource requests and limits
    template: templates/postgres.yaml
    set:
      database.resources.requests.cpu: 2
      database.resources.requests.memory: 8Gi
      database.resources.limits.cpu: 2
      database.resources.limits.memory: 8Gi
    asserts:
      - equal:
          path: spec.resources.requests.cpu
          value: 2
      - equal:
          path: spec.resources.requests.memory
          value: 8Gi
      - equal:
          path: spec.resources.limits.cpu
          value: 2
      - equal:
          path: spec.resources.limits.memory
          value: 8Gi

  - it: renders CloudNativePG affinity and topology scheduling
    template: templates/postgres.yaml
    values:
      - fixtures/database_scheduling.yaml
    asserts:
      - equal:
          path: spec.affinity.nodeSelector.workload
          value: database
      - equal:
          path: spec.affinity.tolerations[0].effect
          value: NoSchedule
      - equal:
          path: spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway

  - it: renders nested CloudNativePG affinity structures
    template: templates/postgres.yaml
    values:
      - fixtures/database_advanced_scheduling.yaml
    asserts:
      - equal:
          path: spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].operator
          value: In
      - equal:
          path: spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 50
      - equal:
          path: spec.affinity.additionalPodAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.affinity.additionalPodAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchExpressions[0].values[0]
          value: database

  - it: renders PostgreSQL parameters as strings
    template: templates/postgres.yaml
    set:
      database.postgresql.parameters.max_connections: "300"
      database.postgresql.parameters.shared_buffers: 2GB
    asserts:
      - equal:
          path: spec.postgresql.parameters.max_connections
          value: "300"
      - equal:
          path: spec.postgresql.parameters.shared_buffers
          value: 2GB

  - it: renders production PostgreSQL storage resources and scheduling
    template: templates/postgres.yaml
    values:
      - ../../../values/values.postgres-production.example.yaml
    asserts:
      - equal:
          path: spec.storage
          value:
            size: 100Gi
            storageClass: low-latency-block
      - equal:
          path: spec.walStorage
          value:
            size: 20Gi
            storageClass: low-latency-block
      - equal:
          path: spec.resources.requests.cpu
          value: "2"
      - equal:
          path: spec.resources.requests.memory
          value: 8Gi
      - equal:
          path: spec.resources.limits.cpu
          value: "2"
      - equal:
          path: spec.resources.limits.memory
          value: 8Gi
      - equal:
          path: spec.affinity.enablePodAntiAffinity
          value: true
      - equal:
          path: spec.affinity.podAntiAffinityType
          value: preferred
      - equal:
          path: spec.affinity.topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.topologySpreadConstraints[0].labelSelector
          value: {}
      - equal:
          path: spec.topologySpreadConstraints[0].matchLabelKeys
          value:
            - cnpg.io/cluster
      - equal:
          path: spec.postgresql.parameters.max_connections
          value: "300"
      - equal:
          path: spec.postgresql.parameters.shared_buffers
          value: 2GB

  - it: does not render CloudNativePG when an external database is configured
    template: templates/postgres.yaml
    set:
      database.type: external
      database.existingSecret: basyx-external-postgres
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an external database secret from inline values
    template: templates/database-secret.yaml
    set:
      database.type: external
      database.existingSecret: ""
      database.external.host: postgres.example.internal
      database.external.port: "5432"
      database.external.dbname: basyx
      database.external.user: basyx
      database.external.password: change-me
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: basyx-external-database
      - equal:
          path: stringData.host
          value: postgres.example.internal
      - equal:
          path: stringData.port
          value: "5432"
      - equal:
          path: stringData.dbname
          value: basyx
      - equal:
          path: stringData.user
          value: basyx
      - equal:
          path: stringData.password
          value: change-me
      - equal:
          path: stringData.jdbc-uri
          value: jdbc:postgresql://postgres.example.internal:5432/basyx

  - it: renders optional external database parameters
    template: templates/database-secret.yaml
    set:
      database.type: external
      database.existingSecret: ""
      database.external.host: postgres.example.internal
      database.external.port: "5432"
      database.external.dbname: basyx
      database.external.user: basyx
      database.external.password: change-me
      database.external.sslmode: require
      database.external.searchPath: myschema
    asserts:
      - equal:
          path: stringData.sslmode
          value: require
      - equal:
          path: stringData.searchPath
          value: myschema
      - equal:
          path: stringData.jdbc-uri
          value: jdbc:postgresql://postgres.example.internal:5432/basyx?sslmode=require&currentSchema=myschema

  - it: renders an external database jdbc uri when port is numeric
    template: templates/database-secret.yaml
    set:
      database.type: external
      database.existingSecret: ""
      database.external.host: postgres.example.internal
      database.external.port: 5432
      database.external.dbname: basyx
      database.external.user: basyx
      database.external.password: change-me
    asserts:
      - equal:
          path: stringData.port
          value: "5432"
      - equal:
          path: stringData.jdbc-uri
          value: jdbc:postgresql://postgres.example.internal:5432/basyx

  - it: does not render an external database secret when existingSecret is configured
    template: templates/database-secret.yaml
    set:
      database.type: external
      database.existingSecret: basyx-external-postgres
    asserts:
      - hasDocuments:
          count: 0

  - it: wires external database credentials into the configuration service
    template: templates/configuration-service-job.yaml
    set:
      database.type: external
      database.existingSecret: basyx-external-postgres
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            valueFrom:
              secretKeyRef:
                name: basyx-external-postgres
                key: host
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: basyx-external-postgres
                key: password
          count: 1

  - it: wires generated inline external database secret into the configuration service
    template: templates/configuration-service-job.yaml
    set:
      database.type: external
      database.existingSecret: ""
      database.external.host: postgres.example.internal
      database.external.port: "5432"
      database.external.dbname: basyx
      database.external.user: basyx
      database.external.password: change-me
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            valueFrom:
              secretKeyRef:
                name: basyx-external-database
                key: host
          count: 1

  - it: ignores existingSecret for managed database mode
    template: templates/configuration-service-job.yaml
    set:
      database.existingSecret: should-not-be-used
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            valueFrom:
              secretKeyRef:
                name: basyx-database-app
                key: host
          count: 1

  - it: wires external database credentials into backend services
    template: templates/aas-registry/deployment.yaml
    set:
      aasRegistry.enabled: true
      database.type: external
      database.existingSecret: basyx-external-postgres
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DBNAME
            valueFrom:
              secretKeyRef:
                name: basyx-external-postgres
                key: dbname
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: basyx-external-postgres
                key: user
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_SSLMODE
            valueFrom:
              secretKeyRef:
                name: basyx-external-postgres
                key: sslmode
                optional: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_SEARCHPATH
            valueFrom:
              secretKeyRef:
                name: basyx-external-postgres
                key: searchPath
                optional: true
          count: 1

  - it: lets a backend service use its own existing database secret
    template: templates/aas-registry/deployment.yaml
    set:
      aasRegistry.enabled: true
      database.type: external
      database.existingSecret: basyx-global-postgres
      aasRegistry.database.existingSecret: basyx-aas-registry-postgres
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            valueFrom:
              secretKeyRef:
                name: basyx-aas-registry-postgres
                key: host
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            valueFrom:
              secretKeyRef:
                name: basyx-global-postgres
                key: host

  - it: renders an inline service-specific database secret
    template: templates/database-secret.yaml
    set:
      aasRegistry.enabled: true
      aasRegistry.database.type: external
      aasRegistry.database.host: aas-registry-postgres.example.internal
      aasRegistry.database.port: "5432"
      aasRegistry.database.dbname: aas_registry
      aasRegistry.database.user: aas_registry
      aasRegistry.database.password: change-me
      aasRegistry.database.sslmode: require
      aasRegistry.database.searchPath: registry_schema
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: basyx-aas-registry-database
      - equal:
          path: stringData.host
          value: aas-registry-postgres.example.internal
      - equal:
          path: stringData.dbname
          value: aas_registry
      - equal:
          path: stringData.sslmode
          value: require
      - equal:
          path: stringData.searchPath
          value: registry_schema
      - equal:
          path: stringData.jdbc-uri
          value: jdbc:postgresql://aas-registry-postgres.example.internal:5432/aas_registry?sslmode=require&currentSchema=registry_schema

  - it: wires an inline service-specific database secret into a backend service
    template: templates/aas-registry/deployment.yaml
    set:
      aasRegistry.enabled: true
      aasRegistry.database.type: external
      aasRegistry.database.host: aas-registry-postgres.example.internal
      aasRegistry.database.port: "5432"
      aasRegistry.database.dbname: aas_registry
      aasRegistry.database.user: aas_registry
      aasRegistry.database.password: change-me
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DBNAME
            valueFrom:
              secretKeyRef:
                name: basyx-aas-registry-database
                key: dbname
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: basyx-aas-registry-database
                key: user
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_SEARCHPATH
            valueFrom:
              secretKeyRef:
                name: basyx-aas-registry-database
                key: searchPath
                optional: true
          count: 1

  - it: wires generated inline external database secret into keycloak
    template: templates/keycloak/deployment.yaml
    set:
      keycloak.enabled: true
      database.type: external
      database.existingSecret: ""
      database.external.host: postgres.example.internal
      database.external.port: "5432"
      database.external.dbname: basyx
      database.external.user: basyx
      database.external.password: change-me
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_DB
            value: "postgres"
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_DB_URL
            valueFrom:
              secretKeyRef:
                name: basyx-external-database
                key: jdbc-uri
          count: 1
