suite: keycloak init
release:
  name: basyx
templates:
  - templates/keycloak-init-config.yaml
  - templates/keycloak-init-job.yaml
  - templates/keycloak-init-script.yaml
  - templates/keycloak/secret.yaml
  - templates/tests/keycloak-realm-test.yaml
tests:
  - it: renders keycloak init config as json payloads
    template: templates/keycloak-init-config.yaml
    set:
      keycloak.enabled: true
    documentSelector:
      path: metadata.name
      value: basyx-keycloak-init-config
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["roles.json"]
          pattern: '\["admin","viewer"\]'
      - matchRegex:
          path: data["clients.json"]
          pattern: '"clientId":"basyx-ui"'
      - notExists:
          path: data["users.json"]
      - matchRegex:
          path: data["user-profile.json"]
          pattern: '"unmanagedAttributePolicy":"ADMIN_EDIT"'

  - it: stores keycloak initialization users in a secret
    template: templates/keycloak/secret.yaml
    set:
      keycloak.enabled: true
    documentSelector:
      path: metadata.name
      value: keycloak-credentials
    asserts:
      - isKind:
          of: Secret
      - matchRegex:
          path: stringData["users.json"]
          pattern: '"username":"basyx\.admin"'
      - matchRegex:
          path: stringData["users.json"]
          pattern: '"value":"changeit"'

  - it: uses the configured web ui client id for managed keycloak
    template: templates/keycloak-init-config.yaml
    set:
      keycloak.enabled: true
      keycloak.webUiClientId: custom-basyx-ui
    documentSelector:
      path: metadata.name
      value: basyx-keycloak-init-config
    asserts:
      - matchRegex:
          path: data["clients.json"]
          pattern: '"clientId":"custom-basyx-ui"'

  - it: renders Catena-X demo client for marker data loading
    template: templates/keycloak-init-config.yaml
    values:
      - ../../../values/values.catena-x.example.yaml
    documentSelector:
      path: metadata.name
      value: basyx-keycloak-init-config
    asserts:
      - matchRegex:
          path: data["clients.json"]
          pattern: '"clientId":"basyx-ui"'
      - matchRegex:
          path: data["clients.json"]
          pattern: '"directAccessGrantsEnabled":true'
      - matchRegex:
          path: data["clients.json"]
          pattern: '"multivalued":"false"'
      - notExists:
          path: data["users.json"]

  - it: stores Catena-X demo users in a secret
    template: templates/keycloak/secret.yaml
    values:
      - ../../../values/values.catena-x.example.yaml
    documentSelector:
      path: metadata.name
      value: keycloak-credentials
    asserts:
      - isKind:
          of: Secret
      - matchRegex:
          path: stringData["users.json"]
          pattern: '"username":"catena-x\.provider"'
      - matchRegex:
          path: stringData["users.json"]
          pattern: '"role":\["view_digital_twin add_digital_twin update_digital_twin delete_digital_twin"\]'
      - matchRegex:
          path: stringData["users.json"]
          pattern: '"value":"change-me"'
      - matchRegex:
          path: stringData["users.json"]
          pattern: '"temporary":false'
      - matchRegex:
          path: stringData["users.json"]
          pattern: '"Edc-Bpn":\["BPN_COMPANY_001"\]'

  - it: renders keycloak init job with release-scoped resources and secret refs
    template: templates/keycloak-init-job.yaml
    set:
      keycloak.enabled: true
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: basyx-keycloak-init
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.gitlab.com/gitlab-ci-utils/curl-jq:4.0.3
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: http://basyx-keycloak:9096
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.name
          value: keycloak-credentials
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.key
          value: admin
      - equal:
          path: spec.template.spec.containers[0].env[4].valueFrom.secretKeyRef.name
          value: keycloak-credentials
      - equal:
          path: spec.template.spec.containers[0].env[4].valueFrom.secretKeyRef.key
          value: adminPassword
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: basyx-keycloak-init-config
          count: 1
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: users
            mountPath: /credentials
            readOnly: true
          count: 1
      - contains:
          path: spec.template.spec.volumes
          content:
            name: users
            secret:
              secretName: keycloak-credentials
              items:
                - key: users.json
                  path: users.json
          count: 1
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scripts
            configMap:
              name: basyx-keycloak-init-script
              defaultMode: 493
          count: 1

  - it: reads keycloak users from the mounted secret
    template: templates/keycloak-init-script.yaml
    set:
      keycloak.enabled: true
    asserts:
      - matchRegex:
          path: data["init.sh"]
          pattern: '/credentials/users\.json'
      - notMatchRegex:
          path: data["init.sh"]
          pattern: '/config/users\.json'

  - it: renders a helm test hook that checks the keycloak realm endpoint
    template: templates/tests/keycloak-realm-test.yaml
    set:
      keycloak.enabled: true
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - equal:
          path: spec.restartPolicy
          value: Never
      - equal:
          path: spec.containers[0].image
          value: curlimages/curl:8.21.0
      - matchRegex:
          path: spec.containers[0].args[0]
          pattern: 'http://basyx-keycloak:9096/identity-management/realms/basyx'
