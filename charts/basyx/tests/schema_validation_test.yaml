suite: schema validation
templates:
  - templates/secret.yaml
tests:
  - it: fails when host is empty
    values:
      - fixtures/invalid_empty_host.yaml
    asserts:
      - failedTemplate:
          errorPattern: "host"

  - it: fails when keycloak client password is not a string
    values:
      - fixtures/invalid_keycloak_client_password.yaml
    asserts:
      - failedTemplate:
          errorPattern: "clientPassword"

  - it: fails when the keycloak path does not start with a slash
    values:
      - fixtures/invalid_keycloak_path.yaml
    asserts:
      - failedTemplate:
          errorPattern: "paths.keycloak"

  - it: fails when the aas environment path does not start with a slash
    values:
      - fixtures/invalid_aas_environment_path.yaml
    asserts:
      - failedTemplate:
          errorPattern: "paths.aasEnvironment"

  - it: fails when the dpp api path does not start with a slash
    values:
      - fixtures/invalid_dpp_api_path.yaml
    asserts:
      - failedTemplate:
          errorPattern: "paths.dppApi"

  - it: fails when history mode is unsupported
    values:
      - fixtures/invalid_history_mode.yaml
    asserts:
      - failedTemplate:
          errorPattern: "history.mode"

  - it: fails when history full snapshot interval is below one
    values:
      - fixtures/invalid_history_full_snapshot_interval.yaml
    asserts:
      - failedTemplate:
          errorPattern: "history.fullSnapshotInterval"

  - it: fails when history immutability mode is unsupported
    values:
      - fixtures/invalid_history_immutability.yaml
    asserts:
      - failedTemplate:
          errorPattern: "history.immutability"

  - it: fails when history audit identity mode is unsupported
    values:
      - fixtures/invalid_history_audit_identity_mode.yaml
    asserts:
      - failedTemplate:
          errorPattern: "history.auditIdentityMode"

  - it: fails when history evidence write timeout is below one
    values:
      - fixtures/invalid_history_evidence_write_timeout.yaml
    asserts:
      - failedTemplate:
          errorPattern: "history.evidence.writeTimeoutSeconds"

  - it: fails when bulk batch limit is below one
    values:
      - fixtures/invalid_general_bulk_batch_limit.yaml
    asserts:
      - failedTemplate:
          errorPattern: "general.bulkBatchLimit"

  - it: fails when upload and AASX package limits are below one
    values:
      - fixtures/invalid_general_aasx_limits.yaml
    asserts:
      - failedTemplate:
          errorPattern: "general"

  - it: fails when server timeout is below one
    values:
      - fixtures/invalid_server_timeout.yaml
    asserts:
      - failedTemplate:
          errorPattern: "server.readTimeoutSeconds"

  - it: fails when service-local server timeout is below one
    values:
      - fixtures/invalid_service_server_timeout.yaml
    asserts:
      - failedTemplate:
          errorPattern: "aasRepository.server.shutdownTimeoutSeconds"

  - it: fails when the logging format is unsupported
    values:
      - fixtures/invalid_logging_format.yaml
    asserts:
      - failedTemplate:
          errorPattern: "logging.format"

  - it: fails when the tracing exporter is unsupported
    values:
      - fixtures/invalid_telemetry_exporter.yaml
    asserts:
      - failedTemplate:
          errorPattern: "telemetry.tracesExporter"

  - it: fails when the metrics exporter is unsupported
    values:
      - fixtures/invalid_telemetry_metrics_exporter.yaml
    asserts:
      - failedTemplate:
          errorPattern: "telemetry.metricsExporter"

  - it: fails when the metrics export interval is not positive
    values:
      - fixtures/invalid_telemetry_metrics_interval.yaml
    asserts:
      - failedTemplate:
          errorPattern: "telemetry.metricsExportInterval"

  - it: fails when OTLP tracing has no Collector endpoint
    values:
      - fixtures/invalid_telemetry_otlp_endpoint.yaml
    asserts:
      - failedTemplate:
          errorPattern: "telemetry.endpoint"

  - it: fails when OTLP metrics have no Collector endpoint
    values:
      - fixtures/invalid_telemetry_metrics_otlp_endpoint.yaml
    asserts:
      - failedTemplate:
          errorPattern: "telemetry.endpoint"

  - it: fails when external database has no existing secret
    values:
      - fixtures/invalid_external_database_missing_secret.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database"

  - it: fails when inline external database password is empty
    values:
      - fixtures/invalid_external_database_empty_password.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database"

  - it: fails when external database sslmode is unsupported
    values:
      - fixtures/invalid_external_database_sslmode.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database"

  - it: fails when service-specific external database values are incomplete
    values:
      - fixtures/invalid_service_database_empty_password.yaml
    asserts:
      - failedTemplate:
          errorPattern: "aasRegistry.database"

  - it: fails when database type is unsupported
    values:
      - fixtures/invalid_database_type.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.type"

  - it: fails when enabled WAL storage has no size
    values:
      - fixtures/invalid_database_wal_storage.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.walStorage.size"

  - it: fails when database pod anti-affinity type is unsupported
    values:
      - fixtures/invalid_database_affinity.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.affinity.podAntiAffinityType"

  - it: fails when database node affinity has an invalid structure
    values:
      - fixtures/invalid_database_node_affinity.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.affinity.nodeAffinity"

  - it: fails when additional database pod affinity has an invalid structure
    values:
      - fixtures/invalid_database_pod_affinity.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.affinity.additionalPodAffinity"

  - it: fails when additional database pod anti-affinity has an invalid weight
    values:
      - fixtures/invalid_database_pod_anti_affinity.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.affinity.additionalPodAntiAffinity"

  - it: fails when database topology selector labels are not strings
    values:
      - fixtures/invalid_database_topology_selector.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.topologySpreadConstraints"

  - it: fails when a PostgreSQL parameter is not a string
    values:
      - fixtures/invalid_database_parameter.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.postgresql.parameters.max_connections"

  - it: fails when a database resource quantity is a decimal number
    values:
      - fixtures/invalid_database_resource_quantity.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.resources.requests.cpu"

  - it: fails when the Pooler mode is unsupported
    values:
      - fixtures/invalid_database_pooler_mode.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.pooler.poolMode"

  - it: fails when an additional Pooler parameter is not a string
    values:
      - fixtures/invalid_database_pooler_parameter.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.pooler.parameters.reserve_pool_size"

  - it: fails when Pooler minDomains is used with ScheduleAnyway
    values:
      - fixtures/invalid_database_pooler_topology.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.pooler.topologySpreadConstraints"

  - it: fails when minDomains is used with ScheduleAnyway
    values:
      - fixtures/invalid_database_min_domains.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.topologySpreadConstraints"

  - it: fails when matchLabelKeys has no label selector
    values:
      - fixtures/invalid_database_match_label_keys.yaml
    asserts:
      - failedTemplate:
          errorPattern: "database.topologySpreadConstraints"

  - it: fails when ABAC policy scope contains unsupported characters
    values:
      - fixtures/invalid_abac_policy_scope.yaml
    asserts:
      - failedTemplate:
          errorPattern: "abac.policyScope"
