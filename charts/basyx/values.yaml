      path: "{{ .Values.paths.aasDiscovery }}/health"
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  # affinity:
