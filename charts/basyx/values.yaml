# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""
# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)

instanceName: "example"
host: "basyx.example.com"

tls:
  enabled: true
  hosts:
    - "{{ .Values.host }}"
  # Optional existing TLS Secret for all generated ingress resources. Defaults
  # to "<release-name>-tls-secret" when empty.
  secretName: ""

internal:
  CACertificates:
    trustStore:
      # Keep the default system trust directory in SSL_CERT_DIR.
      useDefaultCAs: true
      # Mount point for additional CA sources.
      mountPath: /etc/ssl/certs/custom
      # Optional chart-local directory whose files are projected into the trust store.
      # Supports templating, e.g. /config-files/certs/{{ .Values.instanceName }}
      chartFileDirectory: ""
      # Optional inline PEM bundle rendered into a generated ConfigMap.
      additionalCACertificates: ""
      # Optional existing Secret names projected into the trust store.
      extraSecrets: []
      # Optional existing ConfigMap names projected into the trust store.
      extraConfigMaps: []
  certificateIssuer:
    name: internal-issuer
    autocreateCa: false
    autocreateCaSecretName: internal-issuer-ca
    spec:
      ca:
        # references existing ca secret
        secretName: internal-issuer-ca


ingress:
  # Global ingress defaults inherited by all service ingress resources. Services
  # can still override className and annotations under <service>.ingress.
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  clusterIssuer: ""
  issuer: ""
  certificateIssuer:
    enabled: false
    name: ingress-issuer
    spec: {}

# Gateway API HTTPRoute - alternative to Ingress for exposing services.
# Requires Gateway API CRDs and a Gateway resource already installed in the
# cluster (see: https://gateway-api.sigs.k8s.io/guides/). Disabled per
# component via <component>.httpRoute.enabled; a component's own
# httpRoute.parentRefs takes precedence, otherwise the list below is used.
gatewayApi:
  parentRefs: []
  # parentRefs:
  #   - name: my-gateway
  #     namespace: gateway-system
  #     sectionName: https

  # Optionally let the chart create its own Gateway instead of requiring one
  # to already exist (bring-your-own via parentRefs above remains available
  # and still takes precedence when explicitly set). Off by default: a
  # Gateway is cluster-operator-owned, shared infrastructure in the Gateway
  # API model, and every self-created Gateway typically provisions its own
  # LoadBalancer - avoid enabling this across multiple releases that could
  # otherwise share one Gateway.
  gateway:
    enabled: false
    # Defaults to "<release-name>-gateway" when empty.
    name: ""
    # GatewayClass name, e.g. "envoy-gateway". Required when enabled - unlike
    # ingress.className, there is no cluster-portable default.
    className: ""
    annotations: {}
    # Namespaced cert-manager Issuer used to annotate the Gateway with
    # cert-manager.io/issuer, so cert-manager's gateway-shim issues a
    # certificate for the https listener below. Deliberately independent of
    # ingress.issuer - set this to the same Issuer name if you want the
    # Gateway to reuse the certificate the Ingress path would otherwise use,
    # e.g. "internal-issuer" when using the internal CA (see
    # internal.certificateIssuer) or the name of an Issuer created via
    # ingress.certificateIssuer.
    issuer: ""
    # cert-manager ClusterIssuer name, annotated as
    # cert-manager.io/cluster-issuer. Only one of issuer/clusterIssuer should
    # be set; issuer takes precedence when both are.
    clusterIssuer: ""
    port: 80
    tls:
      enabled: true
      port: 443
      # Defaults to tls.secretName / "<release-name>-tls-secret" when empty,
      # the same certificate already used by the Ingress path.
      secretName: ""

paths:
  dashboard: /aas-dataspace-dashboard
  aasDiscovery: /aas-discovery
  aasRegistry: /aas-registry
  aasRepository: /aas-repository
  aasEnvironment: /aas-environment
  dppApi: /dpp-api
  submodelRegistry: /submodel-registry
  submodelRepository: /submodel-repo
  cdRepository: /cd-repository
  companyLookup: /company-lookup
  confSubmodelRepository: /conf-submodel-repo
  aasWebUi: /aas-gui/
  aasWebUiBasePath: /aas-gui
  # Path BaSyx Studio is served under; also its STUDIO_BASE_PATH.
  basyxStudio: /studio
  keycloak: /identity-management
  digitalTwinRegistry: /digital-twin-registry

environment:
  common:
    # Restrict to specific origins in production, e.g.: "https://my-app.example.com"
    # Never combine wildcard '*' with CORS_ALLOWEDCREDENTIALS: true (CSRF risk, browsers block it).
    CORS_ALLOWEDORIGINS: ""
    CORS_ALLOWEDHEADERS: "*"
    CORS_ALLOWEDCREDENTIALS: false
    CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
    # PostgreSQL pool limits are per pod and multiply with replicaCount.
    # Zero for open, idle or lifetime uses the BaSyx Go default. Zero idle time
    # disables recycling based on idle duration.
    POSTGRES_MAXOPENCONNECTIONS: 50
    POSTGRES_MAXIDLECONNECTIONS: 25
    POSTGRES_CONNMAXLIFETIMEMINUTES: 5
    POSTGRES_CONNMAXIDLETIMEMINUTES: 0
    SERVER_STRICTVERIFICATION: permissive
    OIDC_AUDIENCE: discovery-service
    ABAC_ENABLED: false

# Structured logging for all BaSyx Go services, including the Configuration
# Service job. JSON is recommended when logs are collected by a cluster agent.
logging:
  format: text
  level: info

# Optional OpenTelemetry traces and metrics for BaSyx Go HTTP services. The
# chart connects applications to an existing Collector; it does not deploy an
# observability backend. Explicit keys in environment.common override these
# values.
telemetry:
  tracesExporter: none
  metricsExporter: none
  endpoint: ""
  protocol: http/protobuf
  # Optional positive millisecond values. Empty uses the OpenTelemetry SDK
  # defaults.
  metricsExportInterval: ""
  metricsExportTimeout: ""
  # Optional existing Secret containing additional standard OTEL_* variables,
  # for example OTEL_EXPORTER_OTLP_HEADERS. Restart pods after changing it.
  existingSecret: ""
  resourceAttributes: ""
  tracesSampler: parentbased_always_on
  tracesSamplerArg: ""
  propagators:
    - tracecontext
    - baggage

# Shared BaSyx Go runtime configuration rendered into the common environment
# for backend services. Explicit keys in environment.common override these
# structured values.
general:
  enableImplicitCasts: true
  enableDescriptorDebug: false
  discoveryIntegration: false
  enableCustomMiddlewareHeaderInjection: false
  supportsSingularSupplementalSemanticId: false
  aasRegistryIntegration: false
  submodelRegistryIntegration: false
  externalUrl: ""
  trustProxyHeaders: false
  trustedProxyCIDRs: []
  uploadMaxSizeBytes: 134217728
  # Maximum JSON response size from a delegated Submodel Operation. Used by the
  # Submodel Repository and AAS Environment; responses are buffered in memory.
  delegatedOperationResponseMaxSizeBytes: 1048576
  aasxMaxPartCount: 10000
  aasxMaxOPCMetadataSizeBytes: 16777216
  aasxMaxPartExpandedSizeBytes: 134217728
  aasxMaxTotalExpandedSizeBytes: 134217728
  aasxMaxThumbnailSizeBytes: 16777216
  bulkBatchLimit: 1000
  # Comma-rendered into GENERAL_AAS_PRECONFIG_PATHS. Mount matching files or
  # directories with the service-specific volumes/volumeMounts when used.
  aasPreconfigPaths: []

# Shared BaSyx Go HTTP server timeout configuration. Values are rendered into
# SERVER_* environment variables for backend services and must be greater than 0.
server:
  readHeaderTimeoutSeconds: 15
  readTimeoutSeconds: 300
  writeTimeoutSeconds: 300
  idleTimeoutSeconds: 60
  shutdownTimeoutSeconds: 10
  # Page size limits shared by all paginated endpoints, including the REST
  # Event Feed. A limit above maxLimit is rejected with HTTP 400.
  pagination:
    defaultLimit: 100
    maxLimit: 1000

# AAS v3.2 history/audit runtime configuration. Defaults keep history disabled.
history:
  mode: "off"
  retentionDays: 0
  fullSnapshotInterval: 1
  immutability: "none"
  auditIdentityMode: "none"
  evidence:
    enabled: false
    provider: "none"
    bucket: ""
    prefix: basyx-history-evidence
    region: us-east-1
    endpoint: ""
    accessKeyId: ""
    secretAccessKey: ""
    pathStyle: false
    retentionMode: ""
    retentionDays: 0
    writeTimeoutSeconds: 10
    signing:
      privateKeyPath: ""
      publicKeyPath: ""
      required: false
  integrityAnchor:
    provider: "none"

# Experimental CloudEvents eventing for the AAS Repository, Submodel
# Repository and AAS Environment. Broker transports need enabled: true,
# outboxEnabled: true and at least one sink (mqtt, kafka, amqp). The REST Event
# Feed is enabled independently through eventing.feed.enabled. Set
# general.externalUrl (or sourceBaseUrl) to the public API base URL so event
# sources and schema links resolve for consumers. Credentials set here are
# stored in the chart's common-config Secret; prefer the *File settings with
# service volumes for externally managed Secrets.
eventing:
  enabled: false
  format: cloudevents
  # Any of: mqtt, kafka, amqp.
  sinks: []
  outboxEnabled: false
  topicPrefix: basyx
  # Optional overrides of the event source and schema base URLs.
  sourceBaseUrl: ""
  schemaBaseUrl: ""
  mqtt:
    # mqtt://host:port or tls://host:port without credentials.
    broker: ""
    # Must be unique per connecting process. Empty uses the pod name.
    clientId: ""
    sinkId: mqtt
    qos: 1
    retained: false
    username: ""
    password: ""
    usernameFile: ""
    passwordFile: ""
    caFile: ""
    certificateFile: ""
    keyFile: ""
  kafka:
    # Bootstrap brokers as host:port.
    brokers: []
    topic: basyx.events
    sinkId: kafka
    clientId: basyx
    # 0 uses the client default; otherwise 512 to 1073741824.
    producerBatchMaxBytes: 0
    tlsEnabled: false
    caFile: ""
    certificateFile: ""
    keyFile: ""
    # Empty disables SASL; otherwise PLAIN, SCRAM-SHA-256 or SCRAM-SHA-512.
    saslMechanism: ""
    username: ""
    password: ""
    usernameFile: ""
    passwordFile: ""
  amqp:
    # amqp://host[:port] or amqps://host[:port] without credentials.
    broker: ""
    # Target address, e.g. /queues/basyx.events for RabbitMQ 4.
    address: ""
    sinkId: amqp
    # Optional AMQP connection hostname, e.g. vhost:<name> for RabbitMQ.
    hostName: ""
    username: ""
    password: ""
    usernameFile: ""
    passwordFile: ""
    caFile: ""
    certificateFile: ""
    keyFile: ""
  # REST Event Feed (GET /events).
  feed:
    enabled: false
    maxAgeDays: 30
    hardDeleteGraceDays: 10
    sourceBaseUrl: ""
    schemaBaseUrl: ""
    cleanupIntervalHours: 24
    publishIntervalMillis: 250

# Experimental relationship-based access control (ReBAC). ReBAC extends ABAC
# as a strict union (ABAC allows OR ReBAC allows), so every service with ReBAC
# enabled also needs ABAC enabled. Relationships are stored in the BaSyx
# database and shared by all services using it; enable ReBAC consistently on
# all services. Company Lookup and Digital Twin Registry do not support ReBAC.
# Individual services can override these settings via <service>.rebac.*
rebac:
  enabled: false
  # Access token claim with a stable user identifier (e.g. oid for Entra ID).
  subjectClaim: sub
  # Access token claim with group names; use basyx.<target> for mapped claims.
  groupClaim: groups
  # Bootstrap administrators as "issuer|subject" or "issuer|group:<name>".
  administrators: []


# HTTP proxy settings for outbound connections from all services.
# Set to empty string "" to disable. noProxy should include cluster-internal
# domains to avoid proxying internal traffic, e.g.: ".svc.cluster.local,keycloak"
proxy:
  http: ""
  https: ""
  noProxy: "localhost,127.0.0.1,.svc.cluster.local"

# Argo CD applies Helm charts with `helm template` and maps Helm hook
# annotations into its own sync lifecycle. These annotations keep the
# Configuration Service job after chart prerequisites and before runtime pods.
argocd:
  enabled: false
  runtimeSyncWave: "20"

configurationService:
  # The BaSyx Go Configuration Service initializes and migrates the shared
  # PostgreSQL schema before DB-backed runtime services use it.
  enabled: true
  image:
    repository: eclipsebasyx/basyxconfigurationservice-go
    pullPolicy: IfNotPresent
    tag: ""
    digest: ""
  imagePullSecrets: []
  command: []
  args: []
  waitForDatabase:
    enabled: true
    image:
      repository: ghcr.io/cloudnative-pg/postgresql
      pullPolicy: IfNotPresent
      tag: "18.4-system-trixie"
      digest: ""
    intervalSeconds: 5
    timeoutSeconds: 600
    resources: {}
  hook:
    enabled: true
    # post-install is needed because the CNPG database is created by this chart.
    # pre-upgrade runs migrations before new runtime pods start.
    events:
      - post-install
      - pre-upgrade
    weight: "-10"
    deletePolicy:
      - before-hook-creation
    argocd:
      enabled: true
      hook: Sync
      syncWave: "10"
      deletePolicy:
        - BeforeHookCreation
    annotations: {}
  backoffLimit: 12
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  restartPolicy: OnFailure
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

keycloak:
  enabled: false
  # Full OIDC issuer URL for an externally managed identity provider. When
  # empty, the issuer is derived from host, paths.keycloak and realm.
  issuer: ""
  realm: basyx
  # Optional override. Empty uses secrets.client.name (basyx-ui by default).
  webUiClientId: ""
  initJob:
    image:
      repository: registry.gitlab.com/gitlab-ci-utils/curl-jq
      pullPolicy: IfNotPresent
      tag: "4.0.3"
      digest: ""
  tests:
    realmCheck:
      image:
        repository: curlimages/curl
        pullPolicy: IfNotPresent
        tag: 8.21.0
        digest: ""
  initialization:
    userProfile:
      unmanagedAttributePolicy: ADMIN_EDIT

    roles:
      - admin
      - viewer

    # Extra roles appended to the defaults above. Helm cannot merge lists, so
    # this lets deployments add realm roles without re-declaring the defaults.
    extraRoles: []

    clients:

      - clientId: '{{ include `basyx.webUiClientId` . }}'
        publicClient: true
        standardFlowEnabled: true
        implicitFlowEnabled: true

        redirectUris:
          - "https://{{ .Values.host }}{{ .Values.paths.aasWebUiBasePath }}/*"

        webOrigins:
          - "+"

        attributes:
          post.logout.redirect.uris: "https://{{ .Values.host }}{{ .Values.paths.aasWebUiBasePath }}/*"
          oauth2.device.authorization.grant.enabled: "true"
        protocolMappers:
          - name: Role Mapper
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            consentRequired: false
            config:
              aggregate.attrs: "false"
              introspection.token.claim: "true"
              multivalued: "false"
              userinfo.token.claim: "true"
              user.attribute: role
              id.token.claim: "true"
              lightweight.claim: "false"
              access.token.claim: "true"
              claim.name: role
              jsonType.label: String
          - name: discovery-service-aud-mapper
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: discovery-service
              id.token.claim: "false"
              lightweight.claim: "false"
              introspection.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "false"
          - name: Clearance Mapper
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            consentRequired: false
            config:
              aggregate.attrs: "false"
              introspection.token.claim: "true"
              multivalued: "false"
              userinfo.token.claim: "true"
              user.attribute: clear
              id.token.claim: "true"
              lightweight.claim: "false"
              access.token.claim: "true"
              claim.name: clear
              jsonType.label: String

      - clientId: discovery-service
        serviceAccountsEnabled: true

    # Extra clients appended to the defaults above. Helm cannot merge lists, so
    # this lets deployments add realm clients without re-declaring the defaults.
    extraClients: []

    users:
      - username: basyx.admin
        enabled: true
        email: basyx_admin@example.com
        firstName: BaSyx
        lastName: Admin
        emailVerified: true
        attributes:
          role:
            - admin
          clear:
            - admin
        roles:
          - admin
        credentials:
          - type: password
            value: changeit
            temporary: false

    # Extra users appended to the defaults above. Helm cannot merge lists, so
    # this lets deployments add realm users without re-declaring the defaults.
    extraUsers: []
  environment:
    KC_PROXY: edge
    jgroups_dns_query: keycloak
    PROXY_ADDRESS_FORWARDING: true
    KC_HEALTH_ENABLED: true
    KC_HTTP_ENABLED: true
    KC_DB: postgres
    KC_HTTP_MANAGEMENT_ENABLED: "true"
    KC_PROXY_HEADERS: xforwarded
    KC_HOSTNAME_STRICT: "false"
    KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
  monitoring:
    enabled: true
  secrets:
    # name for the creditals secret
    name: "keycloak-credentials"
    # configures admin user for keycloak
    admin:
      username: admin
      password: changeit
    # configures client credentials for keycloak
    client:
      name: basyx-ui
      clientPassword: changeit
  replicaCount: 1
  image:
    repository: keycloak/keycloak
    pullPolicy: IfNotPresent
    tag: 26.5
  imagePullSecrets: []
  nameOverride: "keycloak"
  fullnameOverride: "keycloak"
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: false
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: "keycloak"
  podAnnotations: {}
  podLabels: {}
  # Keycloak runs as root by default. Consult the official image documentation
  # before restricting the security context for production deployments.
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 9096
  managementPort: 9000

  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: "{{ .Values.host }}"
        paths:
          - path: "{{ .Values.paths.keycloak }}"
            pathType: Prefix

  httpRoute:
    enabled: false
    parentRefs: []
    annotations: {}
    hosts:
      - host: "{{ .Values.host }}"
        paths:
          - path: "{{ .Values.paths.keycloak }}"
            pathType: PathPrefix

  resources:
    {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  startupProbe:
    httpGet:
      path: "{{ .Values.paths.keycloak }}/health/started"
      port: management
    failureThreshold: 30
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: "{{ .Values.paths.keycloak }}/health/live"
      port: management
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: "{{ .Values.paths.keycloak }}/health/ready"
      port: management
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--http-enabled=true"
    - "--http-port=9096"
    - "--hostname-strict=false"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Structured OIDC providers trusted by all secured BaSyx backend services.
# Leave this list empty to preserve the default provider derived from
# keycloak.issuer or the chart-managed Keycloak URL. Individual services can
# replace this list through <service>.oidc.providers.
oidc:
  providers: []
  # - issuer: https://login.example.org/realms/basyx
  #   audience: basyx-api
  #   scopes:
  #     - email
  #     - profile
  #   discoveryUrl: ""
  #   scopeClaims: []
  #   claimMappings: []

submodelRepository:
  enabled: false
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    behavior: {}
  image:
    repository: eclipsebasyx/submodelrepository-go
    pullPolicy: IfNotPresent
    tag: ""
    # Image tag is same as Chart App version
  imagePullSecrets: []
  nameOverride: "submodel-repository"
  fullnameOverride: "submodel-repository"
  path: /submodel-repository
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: false
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: "submodel-repository"
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  service:
    type: ClusterIP
    port: "8080"
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: "{{ .Values.host }}"
        paths:
          - path: "{{ .Values.paths.submodelRepository }}"
            pathType: Prefix

  httpRoute:
    enabled: false
    parentRefs: []
    annotations: {}
    hosts:
      - host: "{{ .Values.host }}"
        paths:
          - path: "{{ .Values.paths.submodelRepository }}"
            pathType: PathPrefix

  environment:
    # Keep the Submodel Registry in sync when submodels are created, updated or deleted.
    GENERAL_SUBMODELREGISTRYINTEGRATION: true
    GENERAL_EXTERNALURL: "https://{{ .Values.host }}{{ .Values.paths.submodelRepository }}"
  general: {}
  server: {}
  history: {}
  eventing: {}
  rebac: {}
  oidc: {}
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi
  livenessProbe:
    httpGet:
      path: "{{ .Values.paths.submodelRepository }}/health"
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: "{{ .Values.paths.submodelRepository }}/health"
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  # affinity:
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #       - weight: 100
  #         podAffinityTerm:
  #           topologyKey: kubernetes.io/hostname
  #           labelSelector:
  #             matchLabels:
  #               app.kubernetes.io/name: submodel-repository
  affinity: {}

submodelRegistry:
  enabled: false
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    behavior: {}
  image:
    repository: eclipsebasyx/submodelregistry-go
    pullPolicy: IfNotPresent
    tag: ""
    # Image tag is same as Chart App version
  imagePullSecrets: []
  nameOverride: "submodel-registry"
  fullnameOverride: "submodel-registry"
  path: /submodel-registry
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: false
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: "submodel-registry"
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
