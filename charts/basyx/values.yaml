aasWebGui:
  enabled: false
  replicaCount: 1
  image:
    repository: eclipsebasyx/aas-gui
    pullPolicy: Always
    tag: v2-261013
  imagePullSecrets: []
  nameOverride: "aas-gui"
  fullnameOverride: "aas-gui"
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: false
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: "aas-gui"
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    {}
    # fsGroup: 2000
  securityContext:
    {}
    # runAsUser: 0
    # runAsGroup: 0
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
  service:
    type: NodePort
    port: 3000
  infrastructureConfig:
    infrastructures:
      default: main

      main:
        name: "BaSyx Go {{ .Values.instanceName }}"
        components:
          aasDiscovery:
            baseUrl: "https://{{ .Values.host }}{{ .Values.paths.aasDiscovery }}"
          aasRegistry:
            baseUrl: "https://{{ .Values.host }}{{ .Values.paths.aasRegistry }}"
          submodelRegistry:
            baseUrl: "https://{{ .Values.host }}{{ .Values.paths.submodelRegistry }}"
          aasRepository:
            baseUrl: "https://{{ .Values.host }}{{ .Values.paths.aasRepository }}"
          submodelRepository:
            baseUrl: "https://{{ .Values.host }}{{ .Values.paths.submodelRepository }}"
          conceptDescriptionRepository:
            baseUrl: "https://{{ .Values.host }}{{ .Values.paths.cdRepository }}"
        security:
          type: oauth2
          config:
            flow: auth_code
            issuer: '{{ include "basyx.oidcIssuer" . }}'
            clientId: '{{ include "basyx.webUiClientId" . }}'
  logos:
    light: BaSyx_Logo.svg
    dark: BaSyx_Logo.svg
  environment:
    LOGO_LIGHT_PATH: BaSyx_Logo.svg
    LOGO_DARK_PATH: BaSyx_Logo.svg
  # Environment values that should be stored in a Kubernetes Secret and exposed
  # to the UI container through envFrom.secretRef. Use this for server-side
  # credentials such as EDC API keys.
  secretEnvironment: {}
  # Reference an existing Secret instead of rendering secretEnvironment.
  # The Secret must live in the same namespace and contain environment variable
  # names as keys.
  existingSecretEnvironment: ""


  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: "{{ .Values.host }}"
        paths:
          - path: "{{ .Values.paths.aasWebUi }}"
            pathType: Prefix

  httpRoute:
    enabled: false
    parentRefs: []
    annotations: {}
    hosts:
      - host: "{{ .Values.host }}"
        paths:
          - path: "{{ .Values.paths.aasWebUi }}"
            pathType: PathPrefix

  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi
  livenessProbe:
    httpGet:
      path: "{{ .Values.paths.aasWebUi }}"
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: "{{ .Values.paths.aasWebUi }}"
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  # Additional volumes on the output Deployment definition.
  # volumes:
