# BaSyx Studio, a web workbench for the services of this release and others.
# It can run instead of or next to the AAS Web UI. Every setting maps to an
# environment variable of the Studio image, see
# https://github.com/eclipse-basyx/basyx-studio/blob/main/docs/deployment/README.md.
# Empty strings leave the variable unset, so Studio's own default applies.
basyxStudio:
  enabled: false
  image:
    repository: eclipsebasyx/basyx-studio
    # SNAPSHOT is a moving tag; pin a release or a
    # SNAPSHOT-<yyyymmdd-hhmmss>-<sha> tag for production.
    tag: SNAPSHOT
    # Takes precedence over tag when set, e.g. sha256:...
    digest: ""
    pullPolicy: Always
  imagePullSecrets: []

  # URL under which users reach Studio (STUDIO_PUBLIC_URL). Defaults to
  # https://<host><paths.basyxStudio>; its path must equal paths.basyxStudio.
  publicUrl: ""
  # Lifetime of a Studio session in hours (STUDIO_SESSION_TTL_HOURS).
  sessionTtlHours: ""
  # Largest file users may upload, in bytes (STUDIO_UPLOAD_MAX_BYTES).
  uploadMaxBytes: ""
  # "allow" lets infrastructures on private or loopback addresses be used,
  # each with allowPrivateNetwork (STUDIO_PRIVATE_NETWORK_TARGETS). The
  # infrastructure derived from this release sets allowPrivateNetwork, since
  # host often resolves to a private address inside the cluster.
  privateNetworkTargets: allow

  auth:
    # "oidc" or "none" (STUDIO_AUTH_MODE). Empty selects "oidc" when the
    # release has an identity provider (keycloak.enabled or keycloak.issuer)
    # and "none" otherwise. With "none" every visitor is the shared user
    # "anonymous"; use it for demos, closed networks or behind an
    # authenticating proxy.
    mode: ""
    # Roles of the anonymous user with mode "none" (STUDIO_ANONYMOUS_ROLES).
    # Adding adminRole lets every visitor manage infrastructures and apps.
    anonymousRoles: []
    # Role that may manage infrastructures and apps (STUDIO_ADMIN_ROLE). The
    # chart's Keycloak realm has the realm roles admin and viewer.
    adminRole: admin
    oidc:
      # STUDIO_OIDC_ISSUER; defaults to the issuer of the BaSyx services
      # (keycloak.issuer or the chart-managed Keycloak realm).
      issuer: ""
      # STUDIO_OIDC_CLIENT_ID. With keycloak.enabled and keycloakClient.create,
      # the chart adds this client to the realm.
      clientId: basyx-studio
      # STUDIO_OIDC_SCOPES, default "openid profile email".
      scopes: ""
      # Claim of the ID token with the user's roles; a JSON pointer such as
      # /realm_access/roles for nested claims (STUDIO_OIDC_ROLES_CLAIM,
      # default "roles"). The chart-managed client maps the realm roles to
      # "roles".
      rolesClaim: ""
      # Secret of a confidential client, mounted as
      # STUDIO_OIDC_CLIENT_SECRET_FILE. The chart-managed client is public;
      # set value to store a secret in the Studio Secret, or reference an
      # existing one.
      clientSecret:
        value: ""
        existingSecret: ""
        existingSecretKey: oidc-client-secret

  keycloakClient:
    # Add auth.oidc.clientId as a public client to the chart-managed realm
    # (keycloak.enabled). It gets the Studio redirect URIs, a realm-role
    # mapper to the "roles" ID token claim, and the protocol mappers of the
    # Web UI client, so the tokens Studio sends to the BaSyx services carry
    # the same claims as the Web UI's.
    create: true

  # 32 random bytes, base64url, that encrypt tokens and stored secrets at
  # rest, mounted as STUDIO_DATA_KEY_FILE. Studio cannot read data encrypted
  # with another key, and there is no rotation: keep the key for the life of
  # the data and back it up together with the volume or database.
  #   openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
  # existingSecret is the recommended source, provisioned outside the chart,
  # e.g. with External Secrets or Sealed Secrets; it is required with
  # argocd.enabled unless value is set. Without either, `helm install` and
  # `helm upgrade` generate a key once and reuse it through lookup. That needs
  # Helm's access to the cluster: Argo CD and `helm template` would generate a
  # new key on every render, and helm.sh/resource-policy: keep only stops
  # Helm from deleting the Secret, not from replacing the key.
  dataKey:
    value: ""
    existingSecret: ""
    existingSecretKey: data-key

  # PostgreSQL for Studio's metadata (STUDIO_DATABASE_URL), e.g.
  # postgres://studio:password@postgres:5432/studio. Without it, Studio embeds
  # PGlite in its persistent volume. Either way, one replica only.
  database:
    url: ""
    existingSecret: ""
    existingSecretKey: database-url

  # Infrastructures declared by the deployment (STUDIO_INFRASTRUCTURES_FILE).
  # They are applied at every start (created, updated, and removed when they
  # leave the list) and are read-only in Studio.
  infrastructures:
    # One infrastructure for the services of this release, with their public
    # URLs https://<host><paths.*>. The template follows the enabled
    # services: separate repositories or registries give "full", the AAS
    # Environment alone "mono-all", and the AAS Environment with registries
    # or discovery "mono-repo". The Digital Twin Registry stands in for the
    # AAS registry and discovery when those are disabled.
    derived:
      enabled: true
      key: basyx
      name: "BaSyx Go {{ .Values.instanceName }}"
      # "delegated_user" (the signed-in user's token) or "unsecured". Empty
      # selects "delegated_user" when the release has an identity provider.
      securityMode: ""
      # Connections of the infrastructure: services that are not AAS
      # services, such as InfluxDB for time series or "http" connections that
      # apps call through Studio, bound to app connections with "apps".
      # Secrets are references only, e.g. { ref: env:NAME } with NAME set
      # through extraEnv. Rendered with tpl.
      connections: []
      #  - key: work-orders
      #    type: http
      #    url: http://work-orders.example.svc:8080/api/v1
      #    auth:
      #      scheme: bearer
      #      token: { ref: env:STUDIO_WORK_ORDERS_TOKEN }
      #    allowPrivateNetwork: true
      #    apps:
      #      - { app: org.example.work-orders, connection: orders }
      # Settings of apps on this infrastructure, for settings the apps declare
      # with scope "infrastructure". Not for secrets: settings are stored in
      # plain text and sent to the browser. Rendered with tpl.
      apps: []
      #  - app: org.example.asset-board
      #    settings:
      #      assetTypes: [https://example.org/types/pump]
    # Further entries in the format Studio exports (Infrastructures -> Export
    # all), without the surrounding "version" and "infrastructures" keys.
    # Secrets are references only, e.g. { ref: env:NAME } with NAME set
    # through extraEnv. Rendered with tpl.
    declared: []
    # An existing ConfigMap with the complete YAML document instead of the
    # derived and declared entries.
    existingConfigMap: ""
    existingConfigMapKey: infrastructures.yaml
    # false keeps administrators from adding, changing, removing or importing
    # infrastructures (STUDIO_INFRASTRUCTURES_EDITABLE).
    editable: true

  apps:
    # Separate origin app files are served from (STUDIO_APPS_URL). Without
    # it, apps are off. Two forms:
    # - one origin per installation, with {installation} as the first label:
    #   https://{installation}.apps.example.org. Apps that embed pages need
    #   it. The Ingress and HTTPRoute route the wildcard *.apps.example.org to
    #   Studio; it needs a wildcard DNS record and a wildcard certificate.
    # - one shared origin, e.g. https://apps.example.org, routed as it is.
    # Only an origin: scheme, host and an optional port, without user info,
    # path, query or fragment. The host must differ from Studio's host, and a
    # wildcard must not cover it. Add the host to tls.hosts, or set
    # tls.secretName below.
    url: ""
    tls:
      # Existing TLS Secret for the apps host on the Studio Ingress, e.g. a
      # wildcard certificate for *.apps.example.org. Empty: the release's tls
      # Secret covers it, so tls.hosts must include the apps host.
      secretName: ""
    # Publishers whose keys may sign app packages
    # (STUDIO_APPS_TRUSTED_PUBLISHERS). Signed packages install without
    # developer mode. Studio reads the trust store at startup and does not
    # start with an invalid one; removing a key revokes the apps it signed.
    trustedPublishers:
      # Rendered into a ConfigMap as { version: 1, publishers: [...] }, with tpl.
      publishers: []
      #  - name: Example GmbH            # shown as the verified publisher
      #    keys:                         # ECDSA P-256 PEM public keys
      #      - |
      #        -----BEGIN PUBLIC KEY-----
      #        ...
      #        -----END PUBLIC KEY-----
      #    appIds: [org.example.*]       # IDs, prefixes ending in .*, or *
      #    permissions:                  # reserved permissions it may grant
      #      - studio.timeseries.read
      #    remoteCode: false             # connect origins with WebAssembly or workers
      # An existing ConfigMap with the trust store instead. It is mounted as a
      # whole, so keys may name key files of the same ConfigMap.
      existingConfigMap: ""
      existingConfigMapKey: trusted-publishers.yaml
    # Packages Studio installs and updates at startup (STUDIO_APP_PACKAGES)
    # and marks as managed. A <package>.zip.sig next to a package must verify
    # against the trust store, or the package is skipped. A managed app whose
    # package leaves this list is uninstalled at the next start.
    packages:
      # Downloaded by an init container into an emptyDir at every pod start.
      # A failed download or a wrong sha256 keeps the pod from starting.
      download: []
      #  - name: asset-board             # saved as asset-board.zip
      #    url: https://packages.example.org/asset-board-1.2.0.zip
      #    # Optional: saved as asset-board.zip.sig.
      #    signatureUrl: https://packages.example.org/asset-board-1.2.0.zip.sig
      #    # Optional: checked before Studio sees the package.
      #    sha256: ""
      #    # Optional: a Secret whose key holds request headers, one
      #    # "Name: value" per line, e.g. "Authorization: Bearer <token>".
      #    # They are sent for the package and its signature.
      #    headersSecret: package-registry
      #    headersSecretKey: headers
      downloader:
        # Empty repository: the image of basyxStudio.tests (curl). The
        # container runs with basyxStudio.securityContext.
        image:
          repository: ""
          tag: ""
          digest: ""
          pullPolicy: ""
        resources: {}
        # Size limit of the emptyDir with the downloaded packages.
        sizeLimit: 1Gi
      # Or packages on an existing volume: the .zip files directly in its
      # directory (or subPath) are installed. Set existingClaim, or volume
      # with any volume source, e.g. { nfs: { server: ..., path: ... } }.
      existingClaim: ""
      volume: {}
      subPath: ""
    # Developer-mode installs of unsigned packages (STUDIO_APPS_ALLOW_UNSIGNED).
    allowUnsigned: false
    # false keeps administrators from installing or removing apps; bundled
    # apps stay (STUDIO_APPS_ALLOW_INSTALL).
    allowInstall: true

  branding:
    # Window title and app bar (STUDIO_PRODUCT_NAME).
    productName: ""
    # An http(s) URL, or an absolute path to an SVG, PNG, WebP or JPEG file
    # mounted with extraVolumes (STUDIO_LOGO, STUDIO_LOGO_LIGHT, STUDIO_LOGO_DARK).
    logo: ""
    logoLight: ""
    logoDark: ""
    # Default accent as #RRGGBB (STUDIO_PRIMARY_COLOR, ..._LIGHT, ..._DARK).
    primaryColor: ""
    primaryColorLight: ""
    primaryColorDark: ""
    # Shown in Settings -> About (STUDIO_COPYRIGHT_NAME).
    copyrightName: ""

  legal:
    # Links on the sign-in page and in Settings -> About
    # (STUDIO_LEGAL_NOTICE_URL, STUDIO_PRIVACY_POLICY_URL).
    legalNoticeUrl: ""
    privacyPolicyUrl: ""

  # Switches only narrow what roles allow; they never grant anything.
  switches:
    # Refuse every change to any target and hide editing (STUDIO_READ_ONLY).
    readOnly: false
    # File uploads to targets (STUDIO_ALLOW_UPLOADS).
    allowUploads: true

  # Additional environment variables, e.g. secrets referenced by declared
  # infrastructures as env:NAME, or settings this chart has no value for.
  extraEnv: []
  #  - name: FACTORY_A_CLIENT_SECRET
  #    valueFrom:
  #      secretKeyRef:
  #        name: factory-a-client
  #        key: client-secret
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

  # Volume on /data for the PGlite database and backend app files.
  persistence:
    enabled: true
    # Use an existing PersistentVolumeClaim instead of creating one.
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    annotations: {}
    # Keep the claim when the release is uninstalled
    # (helm.sh/resource-policy: keep).
    keepOnUninstall: true

  serviceAccount:
    create: true
    automount: false
    annotations: {}
    # Generated from the fullname when empty.
    name: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # Size limit of the emptyDir mounted on /tmp.
  tmpSizeLimit: 1Gi
  service:
    type: ClusterIP
    port: 3000
  # The ingress controller must keep the original Host header and must not add
  # X-Frame-Options or a Content-Security-Policy on the apps host.
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: "{{ .Values.host }}"
        paths:
          - path: "{{ .Values.paths.basyxStudio }}"
            pathType: Prefix
  httpRoute:
    enabled: false
    parentRefs: []
    annotations: {}
    hosts:
      - host: "{{ .Values.host }}"
        paths:
          - path: "{{ .Values.paths.basyxStudio }}"
            pathType: PathPrefix
  resources: {}
  #  requests:
  #    cpu: 250m
  #    memory: 512Mi
  #  limits:
  #    memory: 2Gi
  # Probe timings; the paths are <paths.basyxStudio>/health/live and
  # <paths.basyxStudio>/health/ready.
  livenessProbe:
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # Gives migrations on the first start time before the liveness probe applies.
  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
  # Studio stops gracefully on SIGTERM.
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  tests:
    # Image of the `helm test` pod that checks the readiness endpoint.
    image:
      repository: curlimages/curl
      tag: "8.21.0"
      digest: ""
      pullPolicy: IfNotPresent


database:
  clusterName: basyx-database
  # postgres, managed and cnpg deploy a CloudNativePG cluster. Use external to
  # connect BaSyx Go to an existing PostgreSQL database through existingSecret.
  type: postgres
  # Existing Secret for database.type=external. It must contain the keys:
  # host, port, dbname, user, password and jdbc-uri.
  existingSecret: ""
  # Inline external database connection values for database.type=external.
  # If existingSecret is set, these values are ignored.
  # Prefer existingSecret for production and GitOps because inline passwords are
  # stored in Helm release data.
  external:
    host: ""
    port: "5432"
    dbname: ""
    user: ""
    password: ""
    # Optional BaSyx Go PostgreSQL settings. These are rendered as optional
    # POSTGRES_* environment variables for backend services.
    # sslmode: require
    # sslcert: /etc/ssl/certs/postgres/client.crt
    # sslkey: /etc/ssl/certs/postgres/client.key
    # sslrootcert: /etc/ssl/certs/postgres/ca.crt
    # connectTimeoutSeconds: 10
    # applicationName: basyx-go
    # fallbackApplicationName: basyx-go
    # searchPath: basyx
    # options: "-c statement_timeout=30000"
    # timezone: UTC
  # Backend services can override this global database connection individually:
  #
  # aasRegistry:
  #   database:
  #     existingSecret: basyx-aas-registry-postgres
  #     reader:
  #       enabled: true
  #       host: postgres-reader.example.internal
  #
  # Or inline for test deployments:
  #
  # aasRegistry:
  #   database:
  #     type: external
  #     host: postgres.example.internal
  #     port: "5432"
  #     dbname: basyx
  #     user: basyx
  #     password: change-me
  #     sslmode: require
  #     searchPath: registry_schema
  # Optional reader connection for BaSyx Go HTTP services. When disabled, the
  # services reuse their writer pool and no POSTGRES_READER_* variables render.
  # For managed CloudNativePG, enabling this targets <clusterName>-ro, or the
  # read-only Pooler below when reader.pooler.enabled is also true.
  reader:
    enabled: false
    # Existing reader Secret. It must contain host, port, dbname, user and
    # password. Optional connection keys use the same names as database.external.
    existingSecret: ""
    # Inline connection values are stored in a generated Secret. Omitted values
    # reuse the effective writer Secret, so setting only host avoids duplication.
    host: ""
    port: ""
    dbname: ""
    user: ""
    password: ""
    sslmode: ""
    sslcert: ""
    sslkey: ""
    sslrootcert: ""
    connectTimeoutSeconds: 0
    applicationName: ""
    fallbackApplicationName: ""
    searchPath: ""
    options: ""
    timezone: ""
    # Independent per-pod reader pool limits.
    maxOpenConnections: 50
    maxIdleConnections: 25
    connMaxLifetimeMinutes: 5
    connMaxIdleTimeMinutes: 0
    # Optional CloudNativePG read-only Pooler. This requires a managed database,
    # reader.enabled=true and at least two database instances.
    pooler:
      enabled: false
      instances: 2
      poolMode: transaction
      maxClientConn: 1000
      defaultPoolSize: 25
      preparedStatements:
        enabled: true
        maxPreparedStatements: 100
      # Additional CloudNativePG-supported PgBouncer parameters. Values must be
      # strings. The three settings above take precedence over duplicate keys.
      parameters: {}
      resources: {}
      nodeSelector: {}
      affinity: {}
      tolerations: []
      topologySpreadConstraints: []
      # Optional Prometheus Operator PodMonitor for the read-only Pooler.
      monitoring:
        enabled: false
        labels: {}
        annotations: {}
        interval: 30s
        scrapeTimeout: 10s
        # Empty selects pods in the PodMonitor's namespace.
        namespaceSelector: {}
        relabelings: []
        metricRelabelings: []
  # name for the cnpg cluster resource
  # clusterName: "basyx-database"
  # name of database
  # database: "basyx"
  # owner of database
  # owner: "basyx"
  # Number of instances per cluster
  instances: 3
  # Storage configuration
  storage:
    # Volume size per instance
    size: 10Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""
  # A separate WAL volume is optional. Once enabled on an existing CloudNativePG
  # cluster, walStorage cannot be removed again.
  walStorage:
    enabled: false
    size: ""
    # Empty uses the cluster's default StorageClass.
    storageClass: ""
  # PostgreSQL container requests and limits.
  resources: {}
  # CloudNativePG affinity configuration. Supported fields include
  # enablePodAntiAffinity, podAntiAffinityType, topologyKey, nodeSelector,
  # nodeAffinity, tolerations, additionalPodAffinity and
  # additionalPodAntiAffinity.
  affinity: {}
  # Kubernetes topology spread constraints applied to PostgreSQL pods.
  topologySpreadConstraints: []
  # PostgreSQL settings accepted by CloudNativePG. Values must be strings.
  postgresql:
    parameters: {}
  # Optional Prometheus Operator PodMonitor for the managed PostgreSQL pods.
  # The chart does not install Prometheus Operator or its CRDs.
  monitoring:
    enabled: false
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s
    # Empty selects pods in the PodMonitor's namespace.
    namespaceSelector: {}
    relabelings: []
    metricRelabelings: []
  # Optional CloudNativePG read-write Pooler for BaSyx runtime services.
  # The Configuration Service always connects directly to the primary because
  # schema migrations use session-level advisory locks.
  pooler:
    enabled: false
    instances: 2
    poolMode: transaction
    maxClientConn: 1000
    defaultPoolSize: 25
    preparedStatements:
      enabled: true
      maxPreparedStatements: 100
    # Additional CloudNativePG-supported PgBouncer parameters. Values must be
    # strings. The three settings above take precedence over duplicate keys.
    parameters: {}
    resources: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
    topologySpreadConstraints: []
    # Optional Prometheus Operator PodMonitor for this Pooler.
    monitoring:
      enabled: false
      labels: {}
      annotations: {}
      interval: 30s
      scrapeTimeout: 10s
      # Empty selects pods in the PodMonitor's namespace.
      namespaceSelector: {}
      relabelings: []
      metricRelabelings: []

# PodDisruptionBudget: not managed by this chart. For HA deployments, create
# PDBs separately to guarantee availability during node drains. Example:
#
#   apiVersion: policy/v1
#   kind: PodDisruptionBudget
#   metadata:
#     name: basyx-aas-registry-pdb
#     namespace: <your-namespace>
#   spec:
#     minAvailable: 1
#     selector:
#       matchLabels:
#         app.kubernetes.io/name: aas-registry
#         app.kubernetes.io/instance: basyx

# Attribute-Based Access Control (ABAC) configuration.
# When enabled, all services enforce access rules based on JWT token claims.
# accessRules: JSON defining which roles can access which HTTP methods and paths.
# trustList: list of trusted OIDC issuers with audience and scope configuration.
# Individual services can override global ABAC settings via <service>.abac.*
abac:
  enabled: false
  # Startup import behavior for accessRulesFileName:
  # "" uses the service default, otherwise one of always, if_missing, never.
  policyFileImport: ""
  # Optional database namespace for stored ABAC policies. Leave empty to use
  # the service default scope.
  policyScope: ""
  managementApi:
    enabled: false
  mountPath: /security_env
  accessRulesFileName: access-rules.json
  trustListFileName: trustlist.json

  accessRules: |
    {
      "AllAccessPermissionRules": {
        "DEFATTRIBUTES": [
          { "name": "anonymous_attr", "attributes": [{ "GLOBAL": "ANONYMOUS" }] },
          { "name": "role_attr", "attributes": [{ "CLAIM": "role" }] }
        ],
        "DEFOBJECTS": [
          {
            "name": "public_description",
            "objects": [
              { "ROUTE": "/description" },
              { "ROUTE": "{{ .Values.paths.aasRegistry }}/description" },
              { "ROUTE": "{{ .Values.paths.submodelRegistry }}/description" },
              { "ROUTE": "{{ .Values.paths.aasDiscovery }}/description" },
              { "ROUTE": "{{ .Values.paths.aasRepository }}/description" },
              { "ROUTE": "{{ .Values.paths.submodelRepository }}/description" },
              { "ROUTE": "{{ .Values.paths.cdRepository }}/description" },
              { "ROUTE": "{{ .Values.paths.companyLookup }}/description" },
              { "ROUTE": "{{ .Values.paths.dppApi }}/description" }
            ]
          },
          {
            "name": "all_api",
            "objects": [
              { "ROUTE": "/shell-descriptors" },
              { "ROUTE": "/shell-descriptors/*" },
              { "ROUTE": "/submodel-descriptors" },
              { "ROUTE": "/submodel-descriptors/*" },
              { "ROUTE": "/lookup/shells" },
              { "ROUTE": "/lookup/shells/*" },
              { "ROUTE": "/lookup/shellsByAssetLink" },
              { "ROUTE": "/shells" },
              { "ROUTE": "/shells/*" },
              { "ROUTE": "/submodels" },
              { "ROUTE": "/submodels/*" },
              { "ROUTE": "/concept-descriptions" },
              { "ROUTE": "/concept-descriptions/*" },
              { "ROUTE": "/companies" },
              { "ROUTE": "/companies/*" },
              { "ROUTE": "/v1/dpps" },
              { "ROUTE": "/v1/dpps/*" },
              { "ROUTE": "/v1/dppsByProductId/*" },
              { "ROUTE": "/v1/dppsByIdAndDate/*" },
              { "ROUTE": "{{ .Values.paths.aasRegistry }}/shell-descriptors" },
              { "ROUTE": "{{ .Values.paths.aasRegistry }}/shell-descriptors/*" },
              { "ROUTE": "{{ .Values.paths.submodelRegistry }}/submodel-descriptors" },
              { "ROUTE": "{{ .Values.paths.submodelRegistry }}/submodel-descriptors/*" },
              { "ROUTE": "{{ .Values.paths.aasDiscovery }}/lookup/shells" },
              { "ROUTE": "{{ .Values.paths.aasDiscovery }}/lookup/shells/*" },
              { "ROUTE": "{{ .Values.paths.aasDiscovery }}/lookup/shellsByAssetLink" },
              { "ROUTE": "{{ .Values.paths.aasRepository }}/shells" },
              { "ROUTE": "{{ .Values.paths.aasRepository }}/shells/*" },
              { "ROUTE": "{{ .Values.paths.submodelRepository }}/submodels" },
              { "ROUTE": "{{ .Values.paths.submodelRepository }}/submodels/*" },
              { "ROUTE": "{{ .Values.paths.cdRepository }}/concept-descriptions" },
              { "ROUTE": "{{ .Values.paths.cdRepository }}/concept-descriptions/*" },
              { "ROUTE": "{{ .Values.paths.companyLookup }}/companies" },
              { "ROUTE": "{{ .Values.paths.companyLookup }}/companies/*" },
              { "ROUTE": "{{ .Values.paths.dppApi }}/v1/dpps" },
              { "ROUTE": "{{ .Values.paths.dppApi }}/v1/dpps/*" },
              { "ROUTE": "{{ .Values.paths.dppApi }}/v1/dppsByProductId/*" },
              { "ROUTE": "{{ .Values.paths.dppApi }}/v1/dppsByIdAndDate/*" }
            ]
          }
        ],
        "DEFACLS": [
          { "name": "anonymous_read", "acl": { "USEATTRIBUTES": "anonymous_attr", "RIGHTS": ["READ"], "ACCESS": "ALLOW" } },
          { "name": "admin_full", "acl": { "USEATTRIBUTES": "role_attr", "RIGHTS": ["ALL"], "ACCESS": "ALLOW" } }
        ],
        "DEFFORMULAS": [
          { "name": "is_admin", "formula": { "$eq": [{ "$attribute": { "CLAIM": "role" } }, { "$strVal": "admin" }] } }
        ],
        "rules": [
          { "USEACL": "anonymous_read", "USEOBJECTS": ["public_description"], "FORMULA": { "$boolean": true } },
          { "USEACL": "admin_full", "USEOBJECTS": ["all_api"], "USEFORMULA": "is_admin" }
        ]
      }
    }

  trustList: |
    [
      {
        "issuer": "{{ include "basyx.oidcIssuer" . }}",
        "audience": "{{ .Values.environment.common.OIDC_AUDIENCE | default (include "basyx.webUiClientId" .) }}",
        "scopes": ["email", "profile"]
      }
    ]

  services: {}
    # Legacy per-service override location. Prefer `<service>.abac` instead.
    # Supported service keys:
    # aasDiscovery, aasRegistry, aasRepository, aasEnvironment, dppApi,
    # submodelRegistry, submodelRepository, cdRepository, companyLookup,
    # digitalTwinRegistry
